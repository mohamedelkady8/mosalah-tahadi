<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div dir="rtl" style="position: relative; min-height: 100vh; overflow: hidden; background: linear-gradient(180deg, #EBDCC7 0%, #E2CBB2 12%, #CDA98E 20%, #B07C6B 27%, #934E52 34%, #7C3040 41%, #6E1F2E 49%, #651A29 100%); color: #FFFFFF; font-family: 'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif; display: flex; flex-direction: column">

<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.14; mix-blend-mode: overlay">
<filter id="hmGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
<rect width="100%" height="100%" filter="url(#hmGrain)"></rect>
</svg>
<svg aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.18">
<g fill="none" stroke="#7A2A3A" stroke-width="1.2">
<path d="M40 900 V560 H120 V500 H210 V900 M240 900 V610 H330 V900 M1120 900 V520 H1180 V470 H1260 V900 M1290 900 V600 H1400 V900"></path>
<path d="M60 600 H100 M60 640 H100 M260 650 H310 M260 690 H310 M1140 560 H1170 M1300 640 H1390 M1300 680 H1390"></path>
</g>
</svg>

<svg aria-hidden="true" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
<g style="animation: hmDrift 18s ease-in-out infinite">
<g fill="#F3D9C9" opacity="0.16"><ellipse cx="120" cy="900" rx="300" ry="120"></ellipse><ellipse cx="560" cy="930" rx="340" ry="120"></ellipse><ellipse cx="1000" cy="920" rx="330" ry="120"></ellipse><ellipse cx="1400" cy="890" rx="300" ry="130"></ellipse></g>
<g fill="#FFFFFF" opacity="0.08"><ellipse cx="340" cy="840" rx="200" ry="60"></ellipse><ellipse cx="1180" cy="830" rx="220" ry="60"></ellipse></g>
<g fill="#FFFFFF" opacity="0.12"><ellipse cx="1220" cy="260" rx="130" ry="34"></ellipse><ellipse cx="1290" cy="240" rx="80" ry="30"></ellipse><ellipse cx="240" cy="420" rx="110" ry="28"></ellipse></g>
</g>
</svg>

<div aria-hidden="true" style="position: absolute; top: 14%; left: 8%; animation: hmFly 9s ease-in-out infinite">
<svg viewBox="0 0 220 120" style="width: 220px; height: 120px">
<g fill="none" stroke="#7A2A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
<path d="M20 40 Q 30 30 40 40 Q 50 30 60 40" style="transform-origin: 40px 40px; animation: hmFlap 0.9s ease-in-out infinite"></path>
<path d="M90 20 Q 98 12 106 20 Q 114 12 122 20" style="transform-origin: 106px 20px; animation: hmFlap 1.1s ease-in-out infinite"></path>
<path d="M140 60 Q 150 50 160 60 Q 170 50 180 60" style="transform-origin: 160px 60px; animation: hmFlap 0.8s ease-in-out infinite"></path>
<path d="M70 85 Q 77 78 84 85 Q 91 78 98 85" style="transform-origin: 84px 85px; animation: hmFlap 1s ease-in-out infinite"></path>
<path d="M175 100 Q 181 94 187 100 Q 193 94 199 100" style="transform-origin: 187px 100px; animation: hmFlap 1.2s ease-in-out infinite"></path>
</g>
</svg>
</div>

<div aria-hidden="true" style="position: absolute; top: 34%; right: -60px; animation: hmGlide 16s 2s linear infinite">
<svg viewBox="0 0 64 40" style="width: 64px; height: 40px"><path d="M2 20 L62 2 L40 38 L30 24 Z" fill="#E8C46F" stroke="#2E2E30" stroke-width="2" stroke-linejoin="round"></path><path d="M62 2 L30 24" fill="none" stroke="#2E2E30" stroke-width="2"></path></svg>
</div>
<div aria-hidden="true" style="position: absolute; top: 58%; right: -60px; animation: hmGlide 22s 9s linear infinite">
<svg viewBox="0 0 64 40" style="width: 44px; height: 28px"><path d="M2 20 L62 2 L40 38 L30 24 Z" fill="#FFFFFF" stroke="#1F6FB5" stroke-width="2" stroke-linejoin="round"></path><path d="M62 2 L30 24" fill="none" stroke="#1F6FB5" stroke-width="2"></path></svg>
</div>

<header style="position: relative; max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 22px 24px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; animation: hmFade 0.8s ease-out both">
<img src="assets/logo.svg" alt="محمد صلاح" style="height: 52px; width: auto; display: block">
</header>

<main style="position: relative; flex: 1; max-width: 1200px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; align-items: center; text-align: center">

<img src="assets/mr-salah.webp" alt="مستر محمد صلاح" style="width: min(560px, 92%); height: auto; display: block; margin-top: 4px; animation: hmFadeUp 1.1s 0.15s cubic-bezier(.2,.7,.2,1) both, hmBreath 7s 1.4s ease-in-out infinite">

<div aria-hidden="true" style="position: relative; width: 100%; max-width: 900px; height: 0">
<svg viewBox="0 0 24 24" style="position: absolute; top: -40px; right: 6%; width: 30px; height: 30px; animation: hmTwinkle 2.6s ease-in-out infinite"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z" fill="#F6D58A"></path></svg>
<svg viewBox="0 0 24 24" style="position: absolute; top: 10px; left: 8%; width: 22px; height: 22px; animation: hmTwinkle 3.2s 0.8s ease-in-out infinite"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z" fill="#FFFFFF"></path></svg>
<svg viewBox="0 0 24 24" style="position: absolute; top: 90px; left: 2%; width: 16px; height: 16px; animation: hmTwinkle 2.2s 1.4s ease-in-out infinite"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z" fill="#F6D58A"></path></svg>
</div>
<h1 style="margin: -70px 0 0; position: relative; font-family: 'Lalezar', 'IBM Plex Sans Arabic', serif; font-weight: 400; font-size: clamp(56px, 11vw, 132px); line-height: 1.05; color: #FFFFFF; text-shadow: 5px 5px 0 #2E2E30; filter: url(#hmRough); animation: hmFadeUp 0.9s 0.6s cubic-bezier(.2,.7,.2,1) both, hmFloat 4.5s 1.6s ease-in-out infinite">موقع تيم حمثلاح</h1>
<svg aria-hidden="true" width="0" height="0" style="position: absolute">
<filter id="hmRough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="4"></feDisplacementMap></filter>
</svg>
<p style="margin: 6px 0 0; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: clamp(17px, 2.2vw, 24px); letter-spacing: 0.02em; direction: ltr; color: #E8C46F; animation: hmFadeUp 0.9s 0.8s ease-out both">We Don’t Study Alone.</p>

<p style="margin: 26px 0 0; font-weight: 700; font-size: clamp(19px, 2.4vw, 26px); line-height: 1.8; max-width: 760px; animation: hmFadeUp 0.9s 1s ease-out both">هنا هتفضلوا معانا في كل حاجة مختلفة</p>

<div style="position: relative; width: 100%; max-width: 760px; margin-top: 18px; padding: 26px 10px; box-sizing: border-box; animation: hmFade 1s 1.2s ease-out both">
<svg aria-hidden="true" viewBox="0 0 760 200" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
<g fill="none" stroke="#4FA3E0" stroke-width="2" stroke-dasharray="900" style="animation: hmDraw 2.2s 1.4s ease-out both">
<path d="M90 60 L 380 150 L 670 60"></path>
<path d="M90 60 L 280 40 L 480 40 L 670 60"></path>
<path d="M280 40 L 380 150 L 480 40"></path>
<path d="M90 60 L 480 40"></path>
</g>
</svg>
<div style="position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 22px">
<span class="note" style="--r: -4deg; transform: rotate(-4deg); animation-delay: 0s"><span class="pin"></span>مسابقات</span>
<span class="note" style="--r: 3deg; transform: rotate(3deg); animation-delay: 0.4s"><span class="pin"></span>ألعاب</span>
<span class="note" style="--r: -2deg; transform: rotate(-2deg); animation-delay: 0.8s"><span class="pin"></span>ع السريع</span>
<span class="note" style="--r: 4deg; transform: rotate(4deg); animation-delay: 1.2s"><span class="pin"></span>نصايح</span>
<span class="note" style="--r: -3deg; transform: rotate(-3deg); animation-delay: 1.6s"><span class="pin"></span>فيديوهات تحفيزية</span>

</div>
</div>

<p style="margin: 22px 0 0; font-family: 'Lalezar', 'IBM Plex Sans Arabic', serif; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.3; color: #E8C46F; animation: hmFadeUp 0.9s 2s ease-out both">هنكون جزء من يومكوا</p>
<a href="https://tahadi-team-hamthalah.vercel.app/" target="_blank" rel="noopener" style="margin-top: 22px; display: inline-flex; align-items: center; gap: 10px; background: #E8C46F; color: #2E2E30; text-decoration: none; font-weight: 700; font-size: clamp(17px, 2vw, 20px); padding: 15px 30px; min-height: 48px; box-sizing: border-box; border-radius: 16px; box-shadow: 0 6px 0 #2E2E30; animation: hmFadeUp 0.9s 2.2s ease-out both">ابدأ تحدي اليوم<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 20px; height: 20px" fill="none" stroke="#2E2E30" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 L9 12 L15 18"></path></svg></a>

</main>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: #2E2E30; overflow: hidden">

<div style="position: absolute; top: 60px; left: -120px; right: -120px; height: 8px; background: repeating-linear-gradient(90deg, #FFFFFF 0 60px, transparent 60px 120px); animation: hmRoad 1.6s linear infinite"></div>
</div>

<span>الصفحة التالية</span>
<span aria-hidden="true" style="display: flex; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #FFFFFF; background: #1F6FB5; align-items: center; justify-content: center; animation: hmBounce 1.6s ease-in-out infinite">
<svg viewBox="0 0 24 24" style="width: 22px; height: 22px" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9 L12 15 L18 9"></path></svg>
</span>
