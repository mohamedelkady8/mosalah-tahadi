<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختار مرحلتك | تيم حمثلاح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="view-grades" class="gp-root" dir="rtl">
<svg aria-hidden="true" class="grain"><filter id="gpGrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gpGrain)"></rect></svg>
<header class="gp-head"><img src="assets/logo.svg" alt="محمد صلاح" style="height:52px;width:auto;display:block"><a href="index.html" class="back"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2E2E30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 L15 12 L9 18"></path></svg>رجوع</a></header>
<main class="gp-main">
<p class="hello">أهلًا بيك في تيم حمثلاح</p>
<h1 class="gp-title">اختار مرحلتك</h1>
<p class="gp-sub">دوس على مرحلتك، وهنوريك كل الحاجات اللي تخصك</p>
<div class="quote"><span class="qicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#E8C46F"><path d="M4 17 C4 13 5.5 9.5 9.5 7 L10.6 8.6 C8.4 10.1 7.6 11.7 7.5 13 L10 13 L10 19 L4 19 Z M13.5 17 C13.5 13 15 9.5 19 7 L20.1 8.6 C17.9 10.1 17.1 11.7 17 13 L19.5 13 L19.5 19 L13.5 19 Z"></path></svg></span><div><span class="qlabel">هنقولك إيه النهارده؟</span><p id="dailyQuote" class="qtext"></p></div></div>
<div class="grid"><button type="button" class="gp-card" data-grade="٣ ثانوي" style="animation-delay:0.6s">
<span class="shine-wrap" aria-hidden="true"><span class="shine" style="animation-delay:2.0s"></span></span>
<span class="gicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#6E1F2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9 L12 4 L22 9 L12 14 Z M6 11 V16 C6 17.5 9 19 12 19 C15 19 18 17.5 18 16 V11 M22 9 V15"></path></svg></span>
<span class="g-k">طلاب</span><span class="g-n">٣ ثانوي</span><span class="g-s">الصف الثالث الثانوي</span>
<span class="gp-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 L9 12 L15 18"></path></svg></span>
</button><button type="button" class="gp-card" data-grade="تانية بكالوريا" style="animation-delay:0.72s">
<span class="shine-wrap" aria-hidden="true"><span class="shine" style="animation-delay:2.6s"></span></span>
<span class="gicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#6E1F2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5 C5 4 9 4 12 6 C15 4 19 4 22 5 V19 C19 18 15 18 12 20 C9 18 5 18 2 19 Z M12 6 V20"></path></svg></span>
<span class="g-k">طلاب</span><span class="g-n">تانية بكالوريا</span><span class="g-s">الصف الثاني، نظام البكالوريا</span>
<span class="gp-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 L9 12 L15 18"></path></svg></span>
</button><button type="button" class="gp-card" data-grade="أولى ثانوي" style="animation-delay:0.84s">
<span class="shine-wrap" aria-hidden="true"><span class="shine" style="animation-delay:3.2s"></span></span>
<span class="gicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#6E1F2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 V11 M12 11 C12 7 9 5 5 5 C5 9 8 11 12 11 Z M12 13 C12 9 15 7 19 7 C19 11 16 13 12 13 Z"></path></svg></span>
<span class="g-k">طلاب</span><span class="g-n">أولى ثانوي</span><span class="g-s">الصف الأول الثانوي</span>
<span class="gp-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 L9 12 L15 18"></path></svg></span>
</button><button type="button" class="gp-card" data-grade="تانية عام" style="animation-delay:0.96s">
<span class="shine-wrap" aria-hidden="true"><span class="shine" style="animation-delay:3.8s"></span></span>
<span class="gicon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#6E1F2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L14.6 8.6 L20.6 9.3 L16.1 13.4 L17.3 19.4 L12 16.4 L6.7 19.4 L7.9 13.4 L3.4 9.3 L9.4 8.6 Z"></path></svg></span>
<span class="g-k">طلاب</span><span class="g-n">تانية عام</span><span class="g-s">الصف الثاني، النظام العام</span>
<span class="gp-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 L9 12 L15 18"></path></svg></span>
</button></div>
<section class="wheel-sec" aria-labelledby="wheelTitle">
<div class="wheel-text">
<h2 id="wheelTitle">يلا نبدأ</h2>
<p>مش عارف تبدأ منين؟ لف العجلة، وشوف هتبدأ بإيه النهارده.</p>
<div id="result" class="result" hidden><span class="r-k">طلعتلك</span><strong id="rName"></strong><span id="rDesc"></span><a id="rGo" href="#">يلا بينا</a></div>
<button type="button" id="spinBtn" class="spin-btn">لف العجلة</button>
</div>
<div class="wheel-box">
<svg aria-hidden="true" viewBox="0 0 40 34" class="pointer"><path d="M20 34 L2 2 L38 2 Z" fill="#E8C46F" stroke="#2E2E30" stroke-width="2" stroke-linejoin="round"></path></svg>
<div id="wheel" class="wheel" role="img" aria-label="عجلة فيها: مسابقات، ألعاب، ع السريع، نصايح، فيديوهات تحفيزية، سؤال اليوم"></div>
<span class="hub" aria-hidden="true">لف</span>
</div>
</section>
</main>
<footer class="gp-foot">We Don’t Study Alone.</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="grades.js"></script>
</body>
</html>
